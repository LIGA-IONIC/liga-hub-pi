<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Hub PI</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#6d28d9}
.btn.main{background:#6d28d9}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Hub PI</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Entrega 1 proposta</strong><div class="muted">ok</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Entrega 2 prototipo</strong><div class="muted">atrasada</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Entrega 3 video</strong><div class="muted">pendente</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Entrega 4 banner</strong><div class="muted">pendente</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Entrega final</strong><div class="muted">bloqueada</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Hub PI</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item">
        <div>
        <strong>Entrega 2 prototipo</strong>
        <div>
        <span class="badge bad">atrasada</span>
        </div>
        </div>
        </div>
        <div class="aviso erro">Com entrega atrasada a final fica bloqueada</div>
        <div class="item">
        <div>
        <strong>Entrega final</strong>
        </div>
        <button class="btn ghost" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">bloqueada</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
